
apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-portal-backend-hr-deployment
  namespace: company-portal-ns
spec:
  replicas: 5
  selector:
    matchLabels:
      app: company-portal-backend-hr-label
  template:
    metadata:
      labels:
        app: company-portal-backend-hr-label
    spec:
      containers:
      - name: company-portal-backend-hr
        image: docker.io/sureshtamizan/company-portal-backend-hr:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 5000