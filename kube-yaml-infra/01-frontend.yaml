

apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-portal-frontend-deployment
  namespace: company-portal-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-portal-frontend-label
  template:
    metadata:
      labels:
        app: company-portal-frontend-label
    spec:
      containers:
      - name: company-portal-frontendcontainer
        image: docker.io/sureshtamizan/company-portal-frontend:v3
        imagePullPolicy: Always
        ports:
        - containerPort: 8081

